<?xml version="1.0" encoding="UTF-8"?>
<!-- Fundo de tela do superbot.computer: 3024x1476 (2x da tela 1512x738). A coluna da esquerda (até ~300 px)
     fica livre para os atalhos do desktop; o conteúdo vai ao centro-direita. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3024" height="1476" viewBox="0 0 3024 1476">
  <defs>
    <radialGradient id="sky" cx="62%" cy="38%" r="85%">
      <stop offset="0" stop-color="#151a3a"/>
      <stop offset=".55" stop-color="#090c1d"/>
      <stop offset="1" stop-color="#030409"/>
    </radialGradient>
    <linearGradient id="word" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="head" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a3166"/>
      <stop offset="1" stop-color="#141836"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask"><rect x="0" y="980" width="3024" height="496" fill="url(#gridfade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="140"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.6" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
  </defs>

  <!-- céu, pontilhado e auroras desfocadas -->
  <rect width="3024" height="1476" fill="url(#sky)"/>
  <rect width="3024" height="1476" fill="url(#dots)"/>
  <circle cx="2350" cy="380" r="420" fill="#8b5cf6" opacity=".35" filter="url(#blur)"/>
  <circle cx="1350" cy="1050" r="380" fill="#22d3ee" opacity=".22" filter="url(#blur)"/>
  <circle cx="2700" cy="1150" r="300" fill="#d97757" opacity=".22" filter="url(#blur)"/>

  <!-- piso em perspectiva: linhas que fogem para o centro, esmaecendo para cima -->
  <g mask="url(#gridmask)" stroke="#6d7cff" stroke-opacity=".35" stroke-width="2" fill="none">
    <path d="M1812 980 L-1200 1476 M1812 980 L-400 1476 M1812 980 L400 1476 M1812 980 L1200 1476
             M1812 980 L1812 1476 M1812 980 L2424 1476 M1812 980 L3224 1476 M1812 980 L4024 1476
             M1812 980 L4824 1476"/>
    <path d="M0 1000 H3024 M0 1032 H3024 M0 1080 H3024 M0 1150 H3024 M0 1250 H3024 M0 1390 H3024"/>
  </g>

  <!-- mascote: cabeça de robô com antena e olhos acesos -->
  <g transform="translate(2290 250)">
    <line x1="210" y1="40" x2="210" y2="120" stroke="#8b5cf6" stroke-width="14" stroke-linecap="round"/>
    <circle cx="210" cy="34" r="26" fill="#d97757" filter="url(#glow)"/>
    <rect x="0" y="120" width="420" height="330" rx="96" fill="url(#head)" stroke="url(#rim)" stroke-width="10"/>
    <rect x="52" y="190" width="316" height="160" rx="70" fill="#05071a"/>
    <g fill="#22d3ee" filter="url(#glow)">
      <rect x="112" y="238" width="62" height="62" rx="31"/>
      <rect x="246" y="238" width="62" height="62" rx="31"/>
    </g>
    <path d="M160 392 Q210 420 260 392" stroke="#8b5cf6" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="-34" y="230" width="34" height="110" rx="17" fill="#2a3166"/>
    <rect x="420" y="230" width="34" height="110" rx="17" fill="#2a3166"/>
  </g>

  <!-- marca e chamada -->
  <g font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif">
    <text x="760" y="640" font-size="210" font-weight="800" fill="#ffffff" letter-spacing="-6">superbot</text>
    <text x="764" y="800" font-size="150" font-weight="700" fill="#22d3ee" letter-spacing="-3">.computer</text>
    <text x="768" y="920" font-size="54" fill="#c7cbe8" fill-opacity=".85">um computador inteiro para qualquer agente trabalhar</text>
  </g>

  <!-- agentes que rodam na máquina; o texto centralizado não estoura com fonte mais larga -->
  <g font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="38" fill="#e6e8ff" text-anchor="middle">
    <g transform="translate(768 990)">
      <rect width="349" height="76" rx="38" fill="#ffffff" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
      <text x="174" y="51">Claude Code</text>
    </g>
    <g transform="translate(1139 990)">
      <rect width="211" height="76" rx="38" fill="#ffffff" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
      <text x="106" y="51">Codex</text>
    </g>
    <g transform="translate(1372 990)">
      <rect width="188" height="76" rx="38" fill="#ffffff" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
      <text x="94" y="51">Grok</text>
    </g>
    <g transform="translate(1582 990)">
      <rect width="211" height="76" rx="38" fill="#ffffff" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
      <text x="106" y="51">aider</text>
    </g>
    <g transform="translate(1815 990)">
      <rect width="280" height="76" rx="38" fill="#ffffff" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
      <text x="140" y="51">OpenCode</text>
    </g>
    <g transform="translate(2117 990)">
      <rect width="280" height="76" rx="38" fill="#ffffff" fill-opacity=".03" stroke="#22d3ee" stroke-opacity=".25" stroke-width="2"/>
      <text x="140" y="51" fill-opacity=".7">+ outros</text>
    </g>
  </g>
  <text x="770" y="1150" font-family="Helvetica Neue, Helvetica, Arial, DejaVu Sans, sans-serif" font-size="40" fill="#9aa0c8">navegador  ·  terminal  ·  microVM isolada</text>
</svg>
