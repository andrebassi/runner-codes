# Empacotamento do SDK Python: permite `pip install` direto do GitHub, sem PyPI.
#   pip install "git+https://github.com/andrebassi/runner-codes@v1.2.0#subdirectory=sdk/python"
# Sem dependência nenhuma: o pacote só usa a biblioteca padrão (Python 3.9+).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runner-code"
version = "1.2.0"
description = "Cliente da API HTTP do runner.codes (rc serve): jobs efêmeros e máquinas em microVM."
requires-python = ">=3.9"
license = { text = "MPL-2.0" }

[project.urls]
Homepage = "https://runner.codes"
Documentation = "https://docs.runner.codes/api-reference/sdks"
Source = "https://github.com/andrebassi/runner-codes"

# Só o pacote runner_code entra; os testes ficam fora do que se instala.
[tool.setuptools]
packages = ["runner_code"]
