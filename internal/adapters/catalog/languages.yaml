# Catálogo de linguagens deste runner.
#
# name       nome que a API recebe; precisa existir no executor do guest (internal/guest/executor.go)
# image      imagem OCI oficial de origem; o build gera um ext4 read-only a partir dela
# cpus       teto de vCPU por job (contra abuso; vCPU ociosa dorme no hypervisor)
# memory_mib teto de RAM por job (contra abuso; a memória da libkrun é elástica e o
#            footprint medido de VM parada é 44 MB, independente deste número)
# warmup     roda em chroot na VM de build, com rede, e o resultado fica gravado na imagem.
#            Linha única de sh. Nada aqui roda na VM do job.
languages:
  - name: python
    image: python:3.12-alpine
    cpus: 1
    memory_mib: 512
    # A imagem oficial apaga os .pyc; compilar a stdlib tira esse custo do primeiro import.
    warmup: python3 -m compileall -q -j0 /usr/local/lib/python3.12 >/dev/null 2>&1 || true

  - name: nodejs
    image: node:22-alpine
    cpus: 1
    memory_mib: 512
    warmup: ""

  - name: go
    image: golang:1.25-alpine
    cpus: 2
    memory_mib: 1024
    # Popula um GOCACHE na imagem; o start.sh copia para o tmpfs (o root é read-only).
    warmup: mkdir -p /tmp/w && printf 'package main\nimport "fmt"\nfunc main(){fmt.Println(1)}\n' > /tmp/w/m.go && GOCACHE=/opt/runner/gocache go build -o /tmp/w/m /tmp/w/m.go && rm -rf /tmp/w

  - name: rust
    image: rust:1-alpine
    cpus: 2
    memory_mib: 1024
    # O executor do guest força RUSTUP_HOME=/opt/rustup e CARGO_HOME=/opt/cargo (herança do
    # rootfs antigo); a imagem oficial instala em /usr/local. Sem o link o rustup tenta criar
    # /opt/rustup no root read-only e falha (medido). A compilação de teste prova o toolchain.
    warmup: ln -s /usr/local/rustup /opt/rustup && ln -s /usr/local/cargo /opt/cargo && printf 'fn main(){}\n' > /tmp/w.rs && RUSTUP_HOME=/opt/rustup CARGO_HOME=/opt/cargo rustc -o /tmp/w /tmp/w.rs && rm -f /tmp/w /tmp/w.rs

  - name: java
    image: eclipse-temurin:21-jdk-alpine
    cpus: 2
    memory_mib: 1024
    warmup: ""

  - name: c
    image: alpine:3.22
    cpus: 1
    memory_mib: 512
    warmup: apk add --no-cache -q build-base

  - name: cpp
    image: alpine:3.22
    cpus: 1
    memory_mib: 512
    warmup: apk add --no-cache -q build-base

  - name: ruby
    image: ruby:3.3-alpine
    cpus: 1
    memory_mib: 512
    warmup: ""

  - name: php
    image: php:8.3-cli-alpine
    cpus: 1
    memory_mib: 512
    warmup: ""

  - name: perl
    image: alpine:3.22
    cpus: 1
    memory_mib: 512
    warmup: apk add --no-cache -q perl

  - name: bash
    image: bash:5.2
    cpus: 1
    memory_mib: 256
    warmup: ""

  - name: sh
    image: alpine:3.22
    cpus: 1
    memory_mib: 256
    warmup: ""

  - name: awk
    image: alpine:3.22
    cpus: 1
    memory_mib: 256
    warmup: ""

  - name: jq
    image: alpine:3.22
    cpus: 1
    memory_mib: 256
    warmup: apk add --no-cache -q jq

  - name: sqlite
    image: alpine:3.22
    cpus: 1
    memory_mib: 256
    warmup: apk add --no-cache -q sqlite

  # IA com GPU: llama.cpp com backend Vulkan sobre o Venus (virtio-gpu) do guest.
  # - Fedora e não Alpine: o Mesa padrão aloca blobs alinhados a 4 KiB e o hv_vm_map do macOS
  #   exige 16 KiB, então o vkCreateInstance falha (medido no Alpine edge: "Error adding memory
  #   map" e ERROR_OUT_OF_HOST_MEMORY). O Mesa com o patch de 16 KiB só existe pronto no COPR
  #   slp/mesa-libkrun-vulkan (do autor da libkrun), para Fedora.
  # - llama.cpp compilado aqui: o pacote do Fedora não tem backend Vulkan (só CPU e HIP).
  #   Tag e tarball fixos, conferidos por sha256. Estático e só os dois binários: o
  #   `cmake --install` tenta instalar os testes, que não foram compilados, e falha (medido).
  # - O modelo vai para a imagem porque a VM do job não tem rede; o sha256 é o etag LFS do
  #   Hugging Face. Os timeouts seguram download pendurado.
  # gpu: true libera `--gpu`; sem ele a mesma stack roda na CPU (é a comparação do e2e).
  - name: llama
    image: fedora:43
    cpus: 4
    memory_mib: 4096
    gpu: true
    gpu_vram_mib: 4096
    warmup: dnf -y -q install dnf-plugins-core && dnf -y -q copr enable slp/mesa-libkrun-vulkan && dnf -y -q install mesa-vulkan-drivers vulkan-tools vulkan-loader-devel vulkan-headers spirv-headers-devel glslc cmake gcc-c++ make && mkdir -p /tmp/l /opt/models && cd /tmp/l && timeout 300 curl -fsSL -o l.tgz https://github.com/ggml-org/llama.cpp/archive/refs/tags/v0.7.0.tar.gz && echo "55d67acf3ad2ad747a9bbeb75f9f0e173dbcc0d1753a471038a90c819421c5e1  l.tgz" | sha256sum -c - && tar xzf l.tgz && cmake -S llama.cpp-0.7.0 -B b -DGGML_VULKAN=ON -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release >/dev/null && cmake --build b -j4 --target llama-cli llama-bench >/dev/null && install -m 755 b/bin/llama-cli b/bin/llama-bench /usr/local/bin/ && cd / && rm -rf /tmp/l && timeout 600 curl -fsSL -o /opt/models/qwen2.5-0.5b-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf && echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /opt/models/qwen2.5-0.5b-q4_k_m.gguf" | sha256sum -c - && dnf clean all
