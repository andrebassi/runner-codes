name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # host: CLI/serve/vmm. darwin/arm64 sai sem assinatura: o entitlement do
          # hypervisor é aplicado pelo usuário (codesign ad-hoc), descrito no release.
          - { goos: linux, goarch: amd64, pkg: ./cmd/rc, name: rc }
          - { goos: linux, goarch: arm64, pkg: ./cmd/rc, name: rc }
          - { goos: darwin, goarch: arm64, pkg: ./cmd/rc, name: rc }
          # guest: roda dentro da VM, sempre Linux e estático, da arquitetura do host.
          - { goos: linux, goarch: amd64, pkg: ./cmd/runner-guest, name: rc-guest }
          - { goos: linux, goarch: arm64, pkg: ./cmd/runner-guest, name: rc-guest }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          out=dist/${{ matrix.name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o "$out" ${{ matrix.pkg }}
          # O guest tem de sair estático: dinâmico não roda na imagem Alpine (musl).
          if [ "${{ matrix.name }}" = "rc-guest" ] && file "$out" | grep -q 'dynamically linked'; then
            echo "guest saiu dinâmico" >&2; exit 1
          fi
          chmod +x "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.name }}-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cp build/hv.entitlements dist/
          cd dist
          sha256sum rc-* hv.entitlements > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/rc-*
            dist/hv.entitlements
            dist/checksums.txt
          body: |
            ## Runner Codes ${{ github.ref_name }}

            Execução isolada de código gerado por LLM em microVMs libkrun (macOS Apple Silicon e Linux com KVM).

            | Host | Binário do host | Guest (ao lado do host) |
            |---|---|---|
            | Linux x86_64 | `rc-linux-amd64` | `rc-guest-linux-amd64` |
            | Linux ARM64 | `rc-linux-arm64` | `rc-guest-linux-arm64` |
            | macOS Apple Silicon | `rc-darwin-arm64` | `rc-guest-linux-arm64` |

            Pré-requisito: libkrun + libkrunfw pelo Nix, no clone do repo: `nix profile add .#krun` (macOS e Linux).

            No macOS, assine o host com o entitlement do hypervisor (sem ele a VM não sobe):

            ```bash
            codesign --force --sign - --entitlements hv.entitlements rc-darwin-arm64
            ```

            Conferir: `sha256sum -c checksums.txt`
