<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138 24" width="138" height="24" role="img" aria-label="runner.codes">
  <!-- Logo da barra, igual ao da landing: "runner.codes" em mono, o ponto na cor de destaque e um cursor que pisca.
       textLength fixa a largura do texto para o cursor nunca encostar, qualquer que seja a fonte mono do sistema. -->
  <style>
    .t { font: 700 17px ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; fill: #16171a; }
    .d { fill: #1e3a8a; }
    .c { fill: #1e3a8a; animation: b 1.1s steps(1) infinite; }
    @keyframes b { 50% { opacity: 0; } }
  </style>
  <text class="t" x="0" y="18" textLength="122" lengthAdjust="spacingAndGlyphs">runner<tspan class="d">.</tspan>codes</text>
  <rect class="c" x="127" y="4" width="8" height="17" rx="1"/>
</svg>
