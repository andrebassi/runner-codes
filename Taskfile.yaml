# runner.codes — execução de código não confiável em microVMs libkrun.
# https://taskfile.dev
version: '3'

tasks:
  default:
    desc: Lista as tasks
    cmds:
      - task --list

  krun:install:
    desc: Instala libkrun + libkrunfw (macOS via brew slp/krun, Linux via nix)
    cmds:
      - ./scripts/krun-install.sh

  build:
    desc: Compila host + guest em bin/ e assina no macOS
    cmds:
      - ./scripts/build.sh

  image:build:
    desc: "Gera o ext4 de linguagens (ex.: task image:build -- --lang python, ou -- --all)"
    deps: [build]
    cmds:
      - ./bin/runner.code image build {{.CLI_ARGS}}

  run:
    desc: "Executa um código (ex.: task run -- --lang python --code 'print(1)')"
    cmds:
      - ./bin/runner.code run {{.CLI_ARGS}}

  serve:
    desc: API em 127.0.0.1:8080 com pool pré-bootado
    deps: [build]
    cmds:
      - ./bin/runner.code serve {{.CLI_ARGS}}

  doctor:
    desc: Confere se o host roda microVMs
    cmds:
      - ./bin/runner.code doctor

  test:
    desc: Testes de unidade com race detector
    cmds:
      - go test -race -count=1 ./internal/...

  test:cov:
    desc: Gate de cobertura (reprova abaixo de 90% total / 100% domain)
    cmds:
      - ./scripts/coverage-gate.sh

  test:targets:
    desc: Gate multi-alvo (darwin/arm64, linux/amd64, linux/arm64 compilam; windows recusa)
    cmds:
      - ./scripts/targets-gate.sh

  test:e2e:
    desc: Ponta a ponta contra libkrun real (precisa das imagens construídas)
    deps: [build]
    cmds:
      - RUNNER_BIN=$PWD/bin/runner.code go test -count=1 -tags e2e -v ./e2e/...

  gates:
    desc: Rodada completa de gates
    cmds:
      - task: test:targets
      - task: test:cov
      - task: test:e2e

  clean:
    desc: Apaga binários (o cache de imagens fica em ~/Library/Caches/runner-codes)
    cmds:
      - rm -rf bin
