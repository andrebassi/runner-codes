# runner.codes — execução de código não confiável em microVMs libkrun.
# https://taskfile.dev
version: '3'

tasks:
  default:
    desc: List the tasks
    cmds:
      - task --list

  krun:install:
    desc: Install libkrun + libkrunfw via Nix (flake .#krun)
    cmds:
      - ./scripts/krun-install.sh

  build:
    desc: Build host + guest into bin/ and sign on macOS
    cmds:
      - ./scripts/build.sh

  image:build:
    desc: "Build stack images (e.g. task image:build -- --stack python, or -- --all)"
    deps: [build]
    cmds:
      - ./bin/rc image build {{.CLI_ARGS}}

  run:
    desc: "Run code (e.g. task run -- --stack python --code 'print(1)')"
    cmds:
      - ./bin/rc run {{.CLI_ARGS}}

  shell:
    desc: "Interactive shell inside a fresh microVM (e.g. task shell -- --stack python)"
    interactive: true
    cmds:
      - ./bin/rc shell {{.CLI_ARGS}}

  serve:
    desc: HTTP API on 127.0.0.1:8080 with a pre-booted pool
    deps: [build]
    cmds:
      - ./bin/rc serve {{.CLI_ARGS}}

  doctor:
    desc: Check whether this host can run microVMs
    cmds:
      - ./bin/rc doctor

  test:
    desc: Unit tests with the race detector
    cmds:
      - go test -race -count=1 ./internal/...

  test:cov:
    desc: Coverage gate (fails below 90% total / 100% domain)
    cmds:
      - ./scripts/coverage-gate.sh
      - ./scripts/sdk-python-cov.sh

  guides:
    desc: Guide folders (examples/guides), each proven in a real VM; DIRS="pack install" runs some
    cmds:
      - ./scripts/guides.sh {{.DIRS}}

  docs:deploy:
    desc: Build docs.runner.codes (4 locales, broken links fail) and upload to Cloudflare Pages
    cmds:
      - ./scripts/docs-deploy.sh deploy

  scan:secrets:
    desc: Secret scan before commit (content via rtk proxy git diff + new files, and file names)
    cmds:
      - ./scripts/scan-secrets.sh

  playground:check:
    desc: Public playground on Fly - the front token reaches only the visitors app
    cmds:
      - ./scripts/playground-token-check.sh

  check:path:
    desc: Fails if a script puts ~/.nix-profile/bin before ~/.local/bin (the pass gpg2 router) in PATH
    cmds:
      - ./scripts/check-path-order.sh

  site:demos:
    desc: Real VM runs behind the runner.codes site demos; SCENES="network pack" runs some
    cmds:
      - ./scripts/site-demos.sh {{.SCENES}}

  sdk:py:cov:
    desc: Python SDK coverage gate (line and branch, each >= 90%)
    cmds:
      - ./scripts/sdk-python-cov.sh

  test:targets:
    desc: Multi-target gate (darwin/arm64, linux/amd64, linux/arm64 build; windows refused)
    cmds:
      - ./scripts/targets-gate.sh

  test:e2e:
    desc: End-to-end against real libkrun (needs built images)
    deps: [build]
    cmds:
      - RUNNER_BIN=$PWD/bin/rc go test -count=1 -tags e2e -v ./e2e/...

  gates:
    desc: Full gate run
    cmds:
      - task: check:path
      - task: test:targets
      - task: test:cov
      - task: test:e2e
      - task: runbook

  runbook:
    desc: Run docs/runbook.md end to end and check every expected result
    cmds:
      - ./scripts/runbook.sh

  ship:
    desc: 'Push the current branch, open the PR and merge it (GitHub API; -- "<title>" <body-file>)'
    cmds:
      - ./scripts/ship-pr.sh {{.CLI_ARGS}}

  clean:
    desc: Remove binaries (the image cache stays in ~/Library/Caches/runner-codes)
    cmds:
      - rm -rf bin
